name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Validate composer.json files
        run: |
          composer validate --strict --no-check-lock --no-check-publish
          for package in packages/*; do
            composer validate --strict --no-check-lock --no-check-publish --working-dir="$package"
          done

      - name: Install root dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style (Pint)
        run: composer lint -- --test

      - name: Run package tests
        run: composer test

      - name: Install sandbox app dependencies
        working-directory: apps/sandbox
        run: |
          cp -n .env.example .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate

      - name: Run sandbox app tests (integration)
        working-directory: apps/sandbox
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --colors=always
