name: Monorepo Split (manual)

# Manual re-split of every package, e.g. when a split failed after a release.
# Normal splits run automatically from release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to split and publish (e.g. v13.0.1). Leave empty to only update main.'
        required: false
        default: ''

jobs:
  split:
    name: Split ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ models, website, media, admin ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Split package (with tag)
        if: ${{ inputs.tag != '' }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'kusikusicms'
          repository_name: '${{ matrix.package }}'
          branch: 'main'
          tag: ${{ inputs.tag }}

      - name: Split package (branch only)
        if: ${{ inputs.tag == '' }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ matrix.package }}'
          repository_organization: 'kusikusicms'
          repository_name: '${{ matrix.package }}'
          branch: 'main'
