name: Monorepo Split
run-name: "Monorepo Split: ${{ github.event.head_commit.message || (inputs.tag && format('tag {0}', inputs.tag)) || format('manual on {0}', github.ref_name) }}"

# Every push to main splits each project with "split": true in monorepo.json
# into the main branch of its read-only repository. No tags are created here.
# Run it manually with a tag to (re)publish an existing tag, e.g. the v13.0.0 baseline.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to split and push (e.g. v13.0.0). Leave empty to only update main.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: monorepo-split
  cancel-in-progress: false

jobs:
  matrix:
    name: Build split matrix
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      organization: ${{ steps.matrix.outputs.organization }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read monorepo.json
        id: matrix
        run: |
          echo "projects=$(jq -c '[.projects[] | select(.split)]' monorepo.json)" >> "$GITHUB_OUTPUT"
          echo "organization=$(jq -r '.organization' monorepo.json)" >> "$GITHUB_OUTPUT"

  split:
    name: Split ${{ matrix.project.name }}
    needs: matrix
    if: ${{ needs.matrix.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.matrix.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Split project (with tag)
        if: ${{ inputs.tag != '' }}
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          # Token with push access to the split repositories (GITHUB_TOKEN cannot push to other repos)
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.project.path }}
          repository_organization: ${{ needs.matrix.outputs.organization }}
          repository_name: ${{ matrix.project.repository }}
          branch: main
          tag: ${{ inputs.tag }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Split project (branch only)
        if: ${{ inputs.tag == '' }}
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.project.path }}
          repository_organization: ${{ needs.matrix.outputs.organization }}
          repository_name: ${{ matrix.project.repository }}
          branch: main
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
