name: Release

# Manual release. semantic-release computes the next v13.x.y from the squashed PR titles
# (feat = minor, fix/perf = patch, breaking = minor, never major), commits CHANGELOG.md,
# tags the monorepo and publishes a GitHub release. Then every project with
# "publish": true in monorepo.json is split to its own repository *with the tag*.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute the next version and release notes without tagging or publishing.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Validate monorepo.json
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
      organization: ${{ steps.matrix.outputs.organization }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject releases outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Real releases can only run from main. Use dry_run to test other branches."
          exit 1

      - name: Validate publish configuration
        run: |
          invalid="$(jq -r '.projects[] | select(.publish and (.split | not)) | .name' monorepo.json)"
          if [ -n "$invalid" ]; then
            echo "::error::Projects with \"publish\": true must also have \"split\": true: $(echo "$invalid" | tr '\n' ' ')"
            exit 1
          fi

          org="$(jq -r '.organization' monorepo.json)"
          # Warn when a published project requires a sibling project that is not published.
          jq -r '.projects[] | select(.publish) | "\(.name) \(.path)"' monorepo.json | while read -r name path; do
            for dep in $(jq -r --arg org "$org/" '.require // {} | keys[] | select(startswith($org))' "$path/composer.json"); do
              dep_name="${dep#"$org/"}"
              if [ "$(jq -r --arg n "$dep_name" '[.projects[] | select(.name == $n and .publish)] | length' monorepo.json)" = "0" ]; then
                echo "::warning::'$name' requires '$dep', which is not published (\"publish\": false in monorepo.json). composer install will fail for its users."
              fi
            done
          done

      - name: Build publish matrix
        id: matrix
        run: |
          echo "projects=$(jq -c '[.projects[] | select(.publish)]' monorepo.json)" >> "$GITHUB_OUTPUT"
          echo "organization=$(jq -r '.organization' monorepo.json)" >> "$GITHUB_OUTPUT"

  release:
    name: semantic-release
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Token of a GitHub App that is allowed to bypass the main ruleset, so the
      # CHANGELOG.md commit and the tag can be pushed to the protected branch.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git tag --sort=-v:refname | head -n 1 > "$RUNNER_TEMP/tag-before"
          args=(--branches "$GITHUB_REF_NAME")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npx semantic-release "${args[@]}"

      - name: Detect new version
        id: version
        run: |
          git fetch --tags --force
          before="$(cat "$RUNNER_TEMP/tag-before")"
          after="$(git tag --sort=-v:refname | head -n 1)"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.project.name }}
    needs: [plan, release]
    if: ${{ needs.release.outputs.released == 'true' && needs.plan.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Split project to its own repository, with the tag
        uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          # Token with push access to the split repositories (GITHUB_TOKEN cannot push to other repos)
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.project.path }}
          repository_organization: ${{ needs.plan.outputs.organization }}
          repository_name: ${{ matrix.project.repository }}
          branch: main
          tag: ${{ needs.release.outputs.tag }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Notify Packagist (optional)
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          REPOSITORY_URL: https://github.com/${{ needs.plan.outputs.organization }}/${{ matrix.project.repository }}
        run: |
          if [ -z "$PACKAGIST_TOKEN" ] || [ -z "$PACKAGIST_USERNAME" ]; then
            echo "PACKAGIST_USERNAME / PACKAGIST_TOKEN not set; relying on the Packagist GitHub hook."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H 'content-type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPOSITORY_URL}\"}}"
